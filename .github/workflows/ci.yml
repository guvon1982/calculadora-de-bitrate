# CI: roda lint e testes a cada push em develop/main e em todo Pull Request.
# Usa Windows porque o teste do instalador precisa do PowerShell e do Microsoft Edge.
name: CI

on:
  push:
    branches: [develop, main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Auditoria de segurança das dependências
        run: npm audit --audit-level=moderate

      - name: Lint (ESLint + html-validate)
        run: npm run lint

      - name: Testes (calculadora + instalador)
        run: npm test
